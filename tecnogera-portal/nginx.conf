# Rate limit para o login (brute-force / credential stuffing). Contexto http.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 8094;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's internal DNS resolver — defers upstream lookup to request time
    resolver 127.0.0.11 valid=30s;

    # Fotos de celular (feature principal) chegam a vários MB — sem isto o
    # default de 1 MB devolve 413 e o upload quebra.
    client_max_body_size 15m;

    limit_req_status 429;

    # Headers de segurança. Aplicados por herança às respostas que NÃO têm
    # add_header próprio (location / e /api/). Ver nota nos blocos abaixo.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # index.html sem cache. Usa `expires` (não `add_header`) para NÃO cancelar a
    # herança dos headers de segurança acima.
    location = /index.html {
        expires -1;
    }

    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Rate limit específico do login (precede o /api/ genérico por match exato).
    location = /api/v1/portal/login {
        limit_req zone=login burst=5 nodelay;
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        set $upstream http://api:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
