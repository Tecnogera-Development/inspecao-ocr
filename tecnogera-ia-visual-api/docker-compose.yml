name: tecnogera-ia-visual

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: tecnogera/ia-visual-api:${APP_VERSION:-dev}
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
    ports:
      # Bind só no loopback — o portal (nginx) acessa a api pela rede Docker
      # interna (http://api:8000). Não expor na VPN/LAN do host compartilhado.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else sys.exit(1)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped
    networks:
      - ia-visual

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ia_visual}
      POSTGRES_USER: ${POSTGRES_USER:-ia_visual}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ia-visual

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ia-visual

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: tecnogera/ia-visual-api:${APP_VERSION:-dev}
    command: arq app.worker.WorkerSettings
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    restart: unless-stopped
    networks:
      - ia-visual

  portal:
    build:
      context: ../tecnogera-portal
      dockerfile: Dockerfile
    image: tecnogera/portal:${PORTAL_VERSION:-dev}
    container_name: inspecao-web
    ports:
      # Bind só no loopback — o cloudflared (host) alcança via http://localhost:8094.
      # Host compartilhado: não expor na VPN/LAN.
      - "127.0.0.1:${PORTAL_PORT:-8094}:8094"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ia-visual

volumes:
  postgres_data:
  redis_data:

networks:
  ia-visual:
    driver: bridge
