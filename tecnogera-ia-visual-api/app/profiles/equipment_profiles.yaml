# Perfis de equipamentos — campos obrigatórios por formulário Sisloc.
#
# Estrutura: um perfil por FORMULÁRIO Sisloc (não por tipo de equipamento).
# O conjunto de campos `cN` é definido pelo formulário (F013, F180, etc.).
#
# ⚠️ 2026-08-02 — A tabela que a Tecnogera passou na reunião de 2026-07-30
# (c54=FOTO LATERAL DIREITA, c55=LATERAL ESQUERDA, c56=FRONTAL, c57=TRASEIRA,
# ids 49/50/51/52) **NÃO é do F013 — é do F180-VISITA GMG_REV04**, e os mesmos
# códigos valem também no F038 (pré-locação de gerador) e no F277 (liberação de
# plataforma). No F013 os mesmos códigos são outra coisa: `c55` é a plaqueta de
# dados do grupo gerador e `c57` é o carregador de bateria dentro do painel;
# `c54` e `c56` nem existem no F013.
#
# ⚠️ O F180 parou de emitir `c57` entre set e out/2025 — hoje só entrega 3 das
# 4 vistas. O filtro estrito c54∧c55∧c56∧c57 hoje só casa F038 e F277.
#
# O dicionário oficial campo→rótulo continua inacessível: a credencial
# `maisacesso_read` só enxerga a view `dbo.checklist_produto`, que não tem
# granularidade de campo. Rótulos abaixo vêm da tabela da Tecnogera +
# inspeção das imagens reais. Detalhes, queries, censo e pedido de acesso em
# `docs/exploracao/dicionario-campos-sisloc.md`.
#
# Cobertura dos 5 perfis no parque TECG (316 geradores Tecnogera):
#   F013 liberação      —     ┐ dataset original: 7 amostras (POPULADO)
#   F180 visita        25%   │ dataset original: 2 amostras (PRELIMINAR)
#   F262 preventiva    23%   │ aguardando dataset estratificado
#   F193 corretiva     10%   │ aguardando dataset estratificado
#   F098 instalação     3%   │ aguardando dataset estratificado
#   F116 alternador     5%   ┘ aguardando dataset estratificado
#
# Nota: F013 não apareceu no dump de 316 TECG "ativos" pois a view
# dbo.checklist_produto tinha filtro que excluía checklists de liberação.
# Corrigido pela equipe Sisloc em 2026-05-19. F013 está ativo.
#
# FORA DE ESCOPO IA (sem fotos — filtrar antes do Modelo 1):
#   F267 PREVENTIVA S/ FOTO   6%
#   F268 CORRETIVA S/ FOTO    1%
#   F088 RELATÓRIO DIÁRIO     <1%
#
# 36% dos checklists no DB têm formulário VAZIO (99.336 de 276.005, medido em
# 2026-08-02 na dbo.checklist_produto — o número antigo de 13% estava errado).
# Pipeline trata como "desconhecido" e cai em fallback (cluster por assinatura
# de campos).
#
# Formulários com volume relevante que NÃO estão mapeados aqui (medido no DB
# em 2026-08-02): F066 transporte expedição (23k), F277 liberação plataforma
# (19k), F266 transporte retorno (18k), F284 inspeção retorno outros (12k),
# F310 preventiva PEMT (9k), F269 checklist geral (6,7k), F254 inspeção de
# retorno (5,6k), F038 pré-locação de gerador (5,2k).
#
# Thresholds: obrigatório ≥ 6/N (86%), comum ≥ 5/N (71%).
# Descrições `cN` pendentes: o dicionário oficial do Sisloc NÃO é acessível com
# a credencial read-only atual (só a view dbo.checklist_produto foi liberada).
# É preciso um GRANT nas tabelas de definição de campo ou uma exportação do
# Edelmar — ver `docs/exploracao/dicionario-campos-sisloc.md` §8.
# Os rótulos marcados `[visual]` abaixo vêm de inspeção das imagens reais em
# `data/checklists/`, não do dicionário Sisloc.

