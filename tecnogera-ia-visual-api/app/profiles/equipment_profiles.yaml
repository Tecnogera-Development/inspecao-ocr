# Perfis de equipamentos — campos obrigatórios por formulário Sisloc.
#
# Estrutura: um perfil por FORMULÁRIO Sisloc (não por tipo de equipamento).
# O conjunto de campos `cN` é definido pelo formulário (F013, F180, etc.).
#
# Cobertura dos 5 perfis no parque TECG (316 geradores Tecnogera):
#   F013 liberação      —     ┐ dataset original: 7 amostras (POPULADO)
#   F180 visita        25%   │ dataset original: 2 amostras (PRELIMINAR)
#   F262 preventiva    23%   │ aguardando dataset estratificado
#   F193 corretiva     10%   │ aguardando dataset estratificado
#   F098 instalação     3%   │ aguardando dataset estratificado
#   F116 alternador     5%   ┘ aguardando dataset estratificado
#
# Nota: F013 não apareceu no dump de 316 TECG "ativos" pois a view
# dbo.checklist_produto tinha filtro que excluía checklists de liberação.
# Corrigido pela equipe Sisloc em 2026-05-19. F013 está ativo.
#
# FORA DE ESCOPO IA (sem fotos — filtrar antes do Modelo 1):
#   F267 PREVENTIVA S/ FOTO   6%
#   F268 CORRETIVA S/ FOTO    1%
#   F088 RELATÓRIO DIÁRIO     <1%
#
# 13% dos checklists no DB têm formulário VAZIO — pipeline trata como
# "desconhecido" e cai em fallback (cluster por assinatura de campos).
#
# Thresholds: obrigatório ≥ 6/N (86%), comum ≥ 5/N (71%).
# Descrições `cN` pendentes: aguardando resposta do Edelmar sobre tabela
# formulario_campo no Sisloc. Enquanto isso, usar Vision LLM probing.

