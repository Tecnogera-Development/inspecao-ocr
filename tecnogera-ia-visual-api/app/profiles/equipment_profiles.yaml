  # ───────────────────────────────────────────────────────────────────────
  # _unknown_fallback — PERFIL SENTINEL (formulário desconhecido / não populado)
  # ───────────────────────────────────────────────────────────────────────
  # Usado quando o formulário Sisloc do checklist não está mapeado em nenhum
  # perfil populado (F013 é o único populado no MVP). Representa 13% dos
  # checklists com formulário VAZIO + formulários raros sem dataset.
  #
  # As 5 super-classes são agnósticas a formulário — permitem classificação
  # visual genérica útil mesmo sem ground truth de campo. Todas as
  # classificações via este perfil recebem requires_human_review=True.
  _unknown_fallback:
    descricao: "Perfil sentinel para formulário desconhecido — classificação em super-classes visuais genéricas"
    campos:
      - field_name: painel_display
        legivel: Painel / Display
        descricao: "Painel de controle, display digital, indicadores e instrumentos de medição."
        obrigatorio: false
        comum: true
      - field_name: conexao_eletrica
        legivel: Conexão elétrica
        descricao: "Cabos, bornes, conectores, disjuntores e qualquer componente elétrico de interface."
        obrigatorio: false
        comum: true
      - field_name: estrutura_externa
        legivel: Estrutura externa
        descricao: "Chassi, cabine acústica, laterais, portas e fixações externas do equipamento."
        obrigatorio: false
        comum: true
      - field_name: componente_mecanico
        legivel: Componente mecânico
        descricao: "Motor, alternador, filtros, correias, polias e componentes internos mecânicos."
        obrigatorio: false
        comum: true
      - field_name: etiqueta_documento
        legivel: Etiqueta / Documento
        descricao: "Tag patrimonial, etiqueta de identificação, plaqueta de dados e documentos afixados."
        obrigatorio: false
        comum: true

